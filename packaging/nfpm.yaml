# Builds .deb, .rpm, .apk and Arch packages. Used by the release workflow:
#   VERSION=0.1.0 ARCH=amd64 nfpm pkg -f packaging/nfpm.yaml -p deb -t dist/
name: achievetitle
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: ImSammyTTV <https://github.com/ImSammyTTV>
description: Show live Steam achievement progress in your Twitch stream title.
homepage: https://github.com/ImSammyTTV/AchieveTitle
license: MIT
section: games
recommends:
  - xdg-utils
contents:
  - src: build/linux-${ARCH}/achievetitle
    dst: /usr/bin/achievetitle
    file_info: { mode: 0755 }
  - src: packaging/linux/io.github.imsammyttv.AchieveTitle.desktop
    dst: /usr/share/applications/io.github.imsammyttv.AchieveTitle.desktop
  - src: packaging/linux/achievetitle.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.imsammyttv.AchieveTitle.svg
  - src: packaging/linux/io.github.imsammyttv.AchieveTitle.metainfo.xml
    dst: /usr/share/metainfo/io.github.imsammyttv.AchieveTitle.metainfo.xml
  - src: packaging/linux/achievetitle.service
    dst: /usr/lib/systemd/user/achievetitle.service
  - src: LICENSE
    dst: /usr/share/licenses/achievetitle/LICENSE
