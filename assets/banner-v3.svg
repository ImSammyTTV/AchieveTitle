<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f33"/>
      <stop offset="0.55" stop-color="#3a1a78"/>
      <stop offset="1" stop-color="#9147ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#bf94ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bf94ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f5b400"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
    <!-- achievement tile: drifts diagonally, tile 80x80 -->
    <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="68" height="68" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
      <path d="M40 22l5.2 10.6 11.8 1.7-8.5 8.3 2 11.7L40 48.7 29.5 54.3l2-11.7-8.5-8.3 11.8-1.7z" fill="#ffe27a" fill-opacity="0.16"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="80 80" dur="14s" repeatCount="indefinite"/>
    </pattern>
    <style>
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0%,55% { transform: translateX(-420px); } 100% { transform: translateX(1500px); } }
      .t1 { animation: t1 9s infinite; } .t2 { animation: t2 9s infinite; } .t3 { animation: t3 9s infinite; }
      @keyframes t1 { 0%,30% { opacity: 1; } 33%,97% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes t2 { 0%,30% { opacity: 0; } 33%,63% { opacity: 1; } 66%,100% { opacity: 0; } }
      @keyframes t3 { 0%,63% { opacity: 0; } 66%,97% { opacity: 1; } 100% { opacity: 0; } }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#tiles)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="0" width="260" height="400" fill="url(#shine)" transform="skewX(-18)"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffe27a">
    <circle class="twinkle" cx="262" cy="96" r="3"/>
    <circle class="twinkle" cx="78" cy="262" r="2.5" style="animation-delay:1s"/>
    <circle class="twinkle" cx="236" cy="268" r="2" style="animation-delay:2s"/>
  </g>

  <!-- trophy logo -->
  <g transform="translate(96 92)">
    <rect width="150" height="150" rx="34" fill="#9147ff" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <g class="float">
      <path d="M47 33h56v21c0 19-12 33-28 33S47 73 47 54z" fill="url(#gold)"/>
      <path d="M47 40H30c0 16 8 26 21 28M103 40h17c0 16-8 26-21 28" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
      <rect x="68" y="85" width="14" height="19" fill="#f5b400"/>
      <rect x="52" y="104" width="46" height="14" rx="4" fill="url(#gold)"/>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="284" y="160" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-1">AchieveTitle</text>
    <text x="288" y="212" fill="#e3d7ff" font-size="28">Live Steam achievement progress in your Twitch stream title</text>

    <!-- example title, styled like a Twitch stream card -->
    <g transform="translate(288 250)">
      <rect width="640" height="72" rx="14" fill="#0e0e10" fill-opacity="0.75" stroke="#bf94ff" stroke-opacity="0.5"/>
      <circle cx="40" cy="36" r="20" fill="#9147ff"/>
      <path d="M34 25 L34 47 L52 36 Z" fill="#fff"/>
      <circle class="pulse" cx="86" cy="23" r="5" fill="#ff4d4d"/>
      <text x="98" y="29" fill="#adadb8" font-size="16" font-weight="600">LIVE · YourChannel</text>
      <text class="t1" x="76" y="56" fill="#ffffff" font-size="21" font-weight="700">Chill stream [37/50 Achievements] 🏆 First Blood</text>
      <text class="t2" x="76" y="56" fill="#ffffff" font-size="21" font-weight="700">Chill stream [38/50 Achievements] 🏆 Dragon Slayer</text>
      <text class="t3" x="76" y="56" fill="#ffffff" font-size="21" font-weight="700">Chill stream [39/50 Achievements] 🏆 Treasure Hunter</text>
    </g>
  </g>

  <!-- platform chips -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
    <g transform="translate(968 262)"><rect width="240" height="36" rx="18" fill="#ffffff" fill-opacity="0.12"/><text x="120" y="24" text-anchor="middle">Windows · macOS · Linux</text></g>
    <g transform="translate(968 306)"><rect width="240" height="36" rx="18" fill="#ffffff" fill-opacity="0.12"/><text x="120" y="24" text-anchor="middle">Free &amp; open source</text></g>
  </g>
</svg>
