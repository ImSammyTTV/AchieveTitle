<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AchieveTitle overlay</title>
<style>
  body { margin:0; background:transparent; color:#fff; font:600 18px/1.3 system-ui, sans-serif; text-shadow:0 1px 3px #000 }
  #box { padding:12px 16px; width:560px }
  .bar { height:14px; background:rgba(255,255,255,.2); border-radius:7px; overflow:hidden; margin-top:6px }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#9147ff,#bf94ff); transition:width 1s }
  #toast { margin-top:10px; padding:10px 14px; background:rgba(20,20,24,.9); border-left:4px solid #ffd54a; border-radius:6px;
           opacity:0; transform:translateY(10px); transition:all .4s }
  #toast.show { opacity:1; transform:none }
  small { opacity:.8; font-weight:400 }
</style>
</head>
<body>
<div id="box" hidden>
  <div id="line"></div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div id="toast"></div>
</div>
<script>
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seen = null, appId = null;
async function tick() {
  try {
    const s = await (await fetch('/api/status')).json();
    const box = document.getElementById('box');
    box.hidden = !s.total;
    if (!s.total) return;
    document.getElementById('line').innerHTML = `${esc(s.game)} <small>${s.unlocked}/${s.total} achievements</small>`;
    document.getElementById('bar').style.width = (100 * s.unlocked / s.total) + '%';
    const key = s.latest ? s.latest.api_name + s.latest.unlock_time : '';
    // Only celebrate unlocks that happen while the overlay is open, not on first load or game switch.
    if (seen !== null && appId === s.app_id && key && key !== seen) {
      const t = document.getElementById('toast');
      const r = s.latest.global_percent ? ` <small>(${s.latest.global_percent.toFixed(1)}% of players)</small>` : '';
      t.innerHTML = `🏆 Achievement unlocked: ${esc(s.latest.name)}${r}`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 8000);
    }
    seen = key; appId = s.app_id;
  } catch (e) {}
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
