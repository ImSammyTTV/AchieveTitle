<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AchieveTitle recent unlocks</title>
<style>
  /* OBS Browser Source: 480 × 420, transparent background.
     Options: ?count=1-6 (default 5), ?heading=0 hides the heading, ?hideidle=1 hides it outside a Steam game. */
  [hidden] { display:none !important }
  html, body { margin:0; background:transparent; overflow:hidden }
  body { font:600 16px/1.3 "Segoe UI", system-ui, -apple-system, sans-serif; color:#fff; padding:8px; box-sizing:border-box; width:100vw }
  h1 { margin:0 0 8px 4px; font-size:13px; letter-spacing:1.6px; text-transform:uppercase; color:#b9b1cc; font-weight:800;
       text-shadow:0 1px 4px rgba(0,0,0,.8) }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px }
  li { display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:14px;
       background:linear-gradient(135deg, rgba(29,20,48,.92), rgba(16,12,26,.92)); border:1px solid rgba(191,148,255,.3);
       box-shadow:0 6px 18px rgba(0,0,0,.4) }
  li.new { animation:arrive .6s cubic-bezier(.2,.9,.3,1.2), flash 1.4s .5s ease-in-out 2 }
  .icon { width:44px; height:44px; border-radius:9px; flex:none; background:#26222f; display:grid; place-items:center; font-size:22px; object-fit:cover }
  .name { flex:1; min-width:0; font-size:17px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .meta { flex:none; font-size:14px; color:#b9b1cc; font-weight:600; display:flex; gap:12px }
  .rare { color:#ffe27a }
  .empty { color:#a9a3bb; font-size:14px; padding:12px 14px; border-radius:14px; background:rgba(16,12,26,.85) }
  @keyframes arrive { from { opacity:0; transform:translateY(-12px) scale(.97) } to { opacity:1; transform:none } }
  @keyframes flash { 0%,100% { border-color:rgba(191,148,255,.3) } 50% { border-color:#ffe27a; box-shadow:0 0 22px 2px rgba(255,214,90,.6) } }
</style>
</head>
<body>
<div id="wrap" hidden>
  <h1 id="heading">Recent unlocks</h1>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No achievements unlocked yet</div>
</div>
<script>
const q = new URLSearchParams(location.search);
const count = Math.min(Math.max(parseInt(q.get('count') || '5', 10) || 5, 1), 6);
const hideIdle = q.get('hideidle') === '1';
if (q.get('heading') === '0') document.getElementById('heading').hidden = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let seen = null, lastGame = null, lastSig = '';

async function tick() {
  let s;
  try { s = await (await fetch('/api/status')).json(); } catch (e) { return; }
  const wrap = document.getElementById('wrap'), list = document.getElementById('list');
  const recent = (s.recent || []).slice(0, count);
  const inGame = !!s.game;
  wrap.hidden = hideIdle && !inGame;
  document.getElementById('empty').hidden = !inGame || recent.length > 0;
  if (!inGame && !hideIdle) {
    document.getElementById('empty').hidden = false;
    document.getElementById('empty').textContent = 'Waiting for a Steam game…';
  } else {
    document.getElementById('empty').textContent = 'No achievements unlocked yet';
  }
  // Only animate unlocks that appear while the overlay is open, not the ones already there.
  if (s.game !== lastGame) { seen = null; lastGame = s.game; lastSig = ''; }
  const sig = recent.map(a => a.api_name + a.icon + a.global_percent).join('|');
  if (sig === lastSig) return;
  lastSig = sig;
  const known = seen || new Set(recent.map(a => a.api_name));
  list.innerHTML = recent.map(a => {
    const pct = a.global_percent ? (a.global_percent < 10 ? a.global_percent.toFixed(1) : Math.round(a.global_percent)) + '%' : '';
    const when = a.unlock_time ? new Date(a.unlock_time * 1000).toLocaleDateString(undefined, {day:'numeric', month:'short'}) : '';
    const icon = a.icon ? `<img class="icon" src="${esc(a.icon)}" alt="">` : '<div class="icon">🏆</div>';
    return `<li class="${known.has(a.api_name) ? '' : 'new'}">${icon}<div class="name">${esc(a.name)}</div>` +
           `<div class="meta"><span class="${a.global_percent && a.global_percent < 5 ? 'rare' : ''}">${pct}</span><span>${when}</span></div></li>`;
  }).join('');
  seen = new Set([...known, ...recent.map(a => a.api_name)]);
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
