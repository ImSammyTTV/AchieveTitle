# Push a tag like v0.1.0 (or publish a release) to build downloads for
# Windows, macOS and Linux, plus .deb/.rpm/.apk/Arch packages.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: packaging/build-release.sh "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
